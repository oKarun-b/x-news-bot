name: news-bot

on:
  schedule:
    # Bootstrap triggers only — the real cadence is state-driven chaining (§23):
    # each run dispatches the next one ~DISCOVERY_INTERVAL minutes later.
    # Cron remains as a safety net for when a chain link breaks.
    - cron: "3,33 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no Buffer sends)"
        type: boolean
        default: false
      force:
        description: "Force run outside active window"
        type: boolean
        default: false
      chained:
        description: "Chained run (waits for discovery slot)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

# Chained dispatches must not be dropped: allow new trigger while previous finishes.
concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          BOT_TIMEZONE: ${{ vars.BOT_TIMEZONE || 'UTC' }}
          BUFFER_API_URL: https://api.buffer.com
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.chained }}" = "true" ]; then ARGS="$ARGS --chained"; fi
          python -m app.main $ARGS
          code=$?
          # Never fail the workflow on content-level outcomes (no news, AI/Buffer hiccup).
          # Red runs + dropped crons were the main causes of under-production.
          if [ $code -eq 1 ]; then
            echo "::warning::Bot exited 1 (no post / transient hiccup) — keeping workflow green"
            exit 0
          fi
          exit $code

      - name: Commit state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          if ! git diff --quiet -- data/state.json 2>/dev/null; then
            git add data/state.json
            git commit -m "chore: update bot state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
